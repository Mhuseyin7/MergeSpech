services:
  web:
    build: .
    command: npm run start
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    restart: unless-stopped
  worker:
    build: .
    command: npm run worker
    env_file: .env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: mergespech, POSTGRES_USER: mergespech, POSTGRES_PASSWORD: change-me-in-production }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mergespech -d mergespech"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
volumes: { postgres_data: {}, redis_data: {} }
